<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1225"/>
      <stop offset="50%" style="stop-color:#0f0a15"/>
      <stop offset="100%" style="stop-color:#1a0f25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e73a3a"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc107"/>
      <stop offset="100%" style="stop-color:#ff9800"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg)"/>
  <rect x="4" y="4" width="592" height="392" rx="18" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="80" fill="url(#accent)" opacity="0.05"/>
  <circle cx="550" cy="350" r="100" fill="url(#accent)" opacity="0.05"/>
  <!-- Tag icon -->
  <g transform="translate(300,140)">
    <path d="M-35,-35 L35,-35 L35,25 L0,45 L-35,25 Z" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
    <circle cx="-10" cy="-10" r="8" fill="url(#gold)" opacity="0.6"/>
  </g>
  <!-- Main text -->
  <text x="300" y="220" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.5">Inserisci la tua offerta qui</text>
  <!-- Subtitle -->
  <text x="300" y="255" font-family="Inter, sans-serif" font-size="14" fill="#999" text-anchor="middle" letter-spacing="0.5">Contattaci per promuovere il tuo ristorante</text>
  <!-- CTA hint -->
  <rect x="210" y="280" width="180" height="40" rx="20" fill="url(#accent)" opacity="0.15"/>
  <text x="300" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="url(#accent)" text-anchor="middle" letter-spacing="1">TROVAPIATTO.IT</text>
</svg>