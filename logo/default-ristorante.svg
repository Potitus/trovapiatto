<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF3D26"/>
      <stop offset="100%" style="stop-color:#DA4453"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(239,61,38,0.35)"/>
    </filter>
  </defs>
  <!-- Background rounded square - identical to category icons -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Fork -->
  <g transform="translate(175, 100)">
    <!-- Fork handle -->
    <rect x="34" y="220" width="18" height="140" rx="9" fill="white"/>
    <!-- Fork neck -->
    <rect x="28" y="170" width="30" height="60" rx="6" fill="white"/>
    <!-- Fork tines -->
    <rect x="12" y="60" width="10" height="120" rx="5" fill="white"/>
    <rect x="28" y="60" width="10" height="120" rx="5" fill="white"/>
    <rect x="44" y="60" width="10" height="120" rx="5" fill="white"/>
    <rect x="60" y="60" width="10" height="120" rx="5" fill="white"/>
    <!-- Fork top bar -->
    <rect x="8" y="50" width="68" height="16" rx="8" fill="white"/>
  </g>
  
  <!-- Knife -->
  <g transform="translate(260, 100)">
    <!-- Knife handle -->
    <rect x="34" y="220" width="18" height="140" rx="9" fill="white"/>
    <!-- Knife blade -->
    <path d="M20,50 Q28,30 42,50 L48,220 L8,220 Z" fill="white"/>
    <!-- Knife edge highlight -->
    <path d="M26,55 Q30,40 38,55 L42,200 L22,200 Z" fill="rgba(255,255,255,0.25)"/>
  </g>
</svg>