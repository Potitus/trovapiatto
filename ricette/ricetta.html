<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricetta - trovapiatto</title>
    <link id="pageCanon" rel="canonical" href="https://www.trovapiatto.it/ricette/">
    <meta name="description" content="Riproduci questo piatto a casa tua con la ricetta originale.">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.php?size=32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.php?size=180x180">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e73a3a;
            --accent-food: #f59e0b;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(255,255,255,0.04);
            --border-card: rgba(255,255,255,0.08);
            --text-light: #ffffff;
            --text-muted: #a0aec0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
        }

        /* Hero */
        .recipe-hero {
            position: relative;
            height: 50vh;
            min-height: 350px;
            overflow: hidden;
        }
        .recipe-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .recipe-hero-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 3rem 2rem 2rem;
            background: linear-gradient(transparent, rgba(10,10,15,0.95));
        }
        .recipe-hero-overlay h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .recipe-hero-overlay .restaurant-link {
            color: var(--accent-food);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .recipe-hero-overlay .restaurant-link:hover { text-decoration: underline; }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 100;
            width: 44px;
            height: 44px;
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .back-btn:hover { background: var(--primary); border-color: var(--primary); }

        /* Content */
        .recipe-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Stats bar */
        .recipe-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
        }
        .stat-card i {
            font-size: 1.5rem;
            color: var(--accent-food);
            margin-bottom: 0.5rem;
        }
        .stat-card .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            display: block;
        }
        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Section */
        .recipe-section {
            margin-bottom: 2.5rem;
        }
        .recipe-section h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .recipe-section h2 i {
            color: var(--accent-food);
        }

        /* Ingredients */
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }
        .ingredient-item {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ingredient-item .name {
            font-weight: 500;
        }
        .ingredient-item .qty {
            color: var(--accent-food);
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Steps */
        .step-item {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
            padding: 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            transition: all 0.3s;
        }
        .step-item:hover {
            border-color: rgba(245,158,11,0.3);
        }
        .step-number {
            width: 40px;
            height: 40px;
            min-width: 40px;
            background: linear-gradient(135deg, var(--accent-food), #f97316);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
        }
        .step-content {
            flex: 1;
        }
        .step-content p {
            line-height: 1.7;
            color: var(--text-muted);
        }
        .step-content img {
            margin-top: 0.75rem;
            width: 100%;
            border-radius: 12px;
        }

        /* CTA */
        .recipe-cta {
            text-align: center;
            padding: 2.5rem;
            background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(231,58,58,0.08));
            border: 1px solid rgba(245,158,11,0.2);
            border-radius: 20px;
            margin-bottom: 2rem;
        }
        .recipe-cta h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .recipe-cta p {
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }
        .btn-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--accent-food), #f97316);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,158,11,0.3); }

        /* Loading */
        .loading {
            text-align: center;
            padding: 6rem 2rem;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border-card);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            padding: 3rem 2rem;
            text-align: center;
            border-top: 1px solid var(--border-card);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        footer a { color: var(--primary); text-decoration: none; }

        @media (max-width: 600px) {
            .recipe-stats { grid-template-columns: repeat(2, 1fr); }
            .recipe-hero-overlay h1 { font-size: 1.6rem; }
            .ingredients-grid { grid-template-columns: 1fr; }
        }
    </style>

</head>
<body>

    <button class="back-btn" onclick="history.back()" title="Indietro">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div id="recipeContainer">
        <div class="loading">
            <div class="spinner"></div>
            <p>Caricamento ricetta...</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <a href="/">trovapiatto</a> - Riproduci i piatti dei ristoranti a casa tua</p>
    </footer>

    <script>
        const API_BASE = '/app/admin/recipes-api.php';

        async function loadRecipe() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            if (slug) { const c = document.getElementById('pageCanon'); if (c) c.href = 'https://www.trovapiatto.it/ricette/ricetta.html?slug=' + encodeURIComponent(slug); }
            if (!slug) {
                document.getElementById('recipeContainer').innerHTML = `
                    <div class="loading">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem;color:var(--accent-food);"></i>
                        <h3 style="margin-top:1rem;">Ricetta non trovata</h3>
                        <p style="color:var(--text-muted);margin-top:0.5rem;">
                            <a href="/ricette/" style="color:var(--primary);">Torna alle ricette</a>
                        </p>
                    </div>`;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}?action=get-recipe&slug=${encodeURIComponent(slug)}`);
                const data = await res.json();
                if (!data.success || !data.recipe) {
                    document.getElementById('recipeContainer').innerHTML = `
                        <div class="loading">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem;color:var(--accent-food);"></i>
                            <h3 style="margin-top:1rem;">Ricetta non trovata</h3>
                            <p style="color:var(--text-muted);margin-top:0.5rem;">
                                <a href="/ricette/" style="color:var(--primary);">Torna alle ricette</a>
                            </p>
                        </div>`;
                    return;
                }

                const r = data.recipe;
                const totalTime = (r.prep_time_minutes || 0) + (r.cook_time_minutes || 0);
                const diffLabel = {facile: 'Facile', media: 'Media', difficile: 'Difficile'}[r.difficulty] || 'Media';
                const diffIcon = {facile: 'fa-face-smile', media: 'fa-face-meh', difficile: 'fa-face-flushed'}[r.difficulty] || 'fa-face-meh';

                // Update meta tags
                document.title = `${r.dish_name} - Ricetta trovapiatto`;
                document.querySelector('meta[name="description"]').content = r.description || `Ricetta per ${r.dish_name}`;

                const ingredients = (r.ingredients || []).map(ing =>
                    `<div class="ingredient-item">
                        <span class="name">${ing.name}</span>
                        <span class="qty">${ing.quantity} ${ing.unit}</span>
                    </div>`
                ).join('');

                const steps = (r.steps || []).map(s => `
                    <div class="step-item">
                        <div class="step-number">${s.step}</div>
                        <div class="step-content">
                            <p>${s.description}</p>
                            ${s.image_url ? `<img src="${s.image_url}" alt="Step ${s.step}" loading="lazy">` : ''}
                        </div>
                    </div>
                `).join('');

                document.getElementById('recipeContainer').innerHTML = `
                    <div class="recipe-hero">
                        <img src="${r.image_url || 'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=1200&h=600&fit=crop'}" alt="${r.dish_name}">
                        <div class="recipe-hero-overlay">
                            <h1>${r.dish_name}</h1>
                            ${r.restaurant_name ? `
                                <a href="/menu/${r.restaurant_slug || ''}/" class="restaurant-link">
                                    <i class="fa-solid fa-store"></i> ${r.restaurant_name}
                                    ${r.city ? ` - ${r.city}` : ''}
                                </a>
                            ` : ''}
                        </div>
                    </div>

                    <div class="recipe-content">
                        <div class="recipe-stats">
                            <div class="stat-card">
                                <i class="fa-solid fa-clock"></i>
                                <span class="stat-value">${r.prep_time_minutes || 15} min</span>
                                <span class="stat-label">Preparazione</span>
                            </div>
                            <div class="stat-card">
                                <i class="fa-solid fa-fire"></i>
                                <span class="stat-value">${r.cook_time_minutes || 30} min</span>
                                <span class="stat-label">Cottura</span>
                            </div>
                            <div class="stat-card">
                                <i class="fa-solid fa-hourglass-half"></i>
                                <span class="stat-value">${totalTime} min</span>
                                <span class="stat-label">Totale</span>
                            </div>
                            <div class="stat-card">
                                <i class="fa-solid ${diffIcon}"></i>
                                <span class="stat-value">${diffLabel}</span>
                                <span class="stat-label">Difficoltà</span>
                            </div>
                        </div>

                        ${r.description ? `<p style="color:var(--text-muted);font-size:1.05rem;line-height:1.7;margin-bottom:2.5rem;">${r.description}</p>` : ''}

                        <div class="recipe-section">
                            <h2><i class="fa-solid fa-basket-shopping"></i> Ingredienti (${r.portions || 4} porzioni)</h2>
                            <div class="ingredients-grid">${ingredients}</div>
                        </div>

                        <div class="recipe-section">
                            <h2><i class="fa-solid fa-list-ol"></i> Procedimento</h2>
                            ${steps}
                        </div>

                        ${r.restaurant_name ? `
                        <div class="recipe-cta">
                            <h3><i class="fa-solid fa-store"></i> Vuoi assaggiare l'originale?</h3>
                            <p>Prenota un tavolo da ${r.restaurant_name} e gusta il piatto come si deve.</p>
                            <a href="/menu/${r.restaurant_slug || ''}/" class="btn-cta">
                                <i class="fa-solid fa-utensils"></i> Vai al Menù
                            </a>
                        </div>
                        ` : ''}
                    </div>
                `;
            } catch (err) {
                document.getElementById('recipeContainer').innerHTML = `
                    <div class="loading">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size:3rem;color:var(--accent-food);"></i>
                        <h3 style="margin-top:1rem;">Errore di connessione</h3>
                        <p style="color:var(--text-muted);margin-top:0.5rem;">Riprova più tardi.</p>
                    </div>`;
            }
        }

        loadRecipe();
    </script>
</body>
</html>
